<!-- begin tools & certifications marquee -->
<section class="section tools-marquee-section">
  <div class="container">
    <div class="section__info">
      <div class="section__head">
        <h2 class="section__title">{{ site.data.tools_marquee.title | default: "Tools & Certifications" }}</h2>
      </div>
    </div>
  </div>

  <div class="tools-marquee" aria-label="Software and Certifications">
    <div class="tools-marquee__track">
      {% for item in site.data.tools_marquee.items %}
        <div class="tools-marquee__item">
          <img src="{{ site.baseurl }}{{ item.icon }}">
          <span>{{ item.name }}</span>
        </div>
      {% endfor %}

      <!-- Duplicato per lo scorrimento infinito -->
      {% for item in site.data.tools_marquee.items %}
        <div class="tools-marquee__item" aria-hidden="true">
          <img src="{{ item.icon }}" alt="">
          <span>{{ item.name }}</span>
        </div>
      {% endfor %}
    </div>
  </div>
</section>
<!-- end tools & certifications marquee -->
