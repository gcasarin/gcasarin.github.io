<section class="section skills-section" id="skills">
  <div class="container">
    <div class="row skills-header-row">
      <div class="col-md-12 skills-title-col">
        <h2 class="section-title">My skills</h2>
      </div>
    </div>

    <div class="row mt-4 pie-layout">
      <!-- Colonna sinistra: grafico a torta centrato orizzontalmente e verticalmente -->
      <div class="col-lg-5 mb-4 mb-lg-0 pie-col">
        <div class="pie-wrapper">
          <svg class="skills-pie" viewBox="0 0 220 220" width="280" height="280" role="img" aria-label="Skills breakdown: Engineering, Project Management, and Data Analytics">
            <!-- Fetta 1: Engineering (120°) -->
            <path
              class="pie-slice"
              d="M 110 110 L 110 14 A 96 96 0 0 1 193.138 158 Z"
              fill="#1e4d6b"
              data-target="eng"
            />

            <!-- Fetta 2: Project Management (120°) -->
            <path
              class="pie-slice"
              d="M 110 110 L 193.138 158 A 96 96 0 0 1 26.862 158 Z"
              fill="#0d9488"
              data-target="pm"
            />

            <!-- Fetta 3: Data Analytics (120°) -->
            <path
              class="pie-slice"
              d="M 110 110 L 26.862 158 A 96 96 0 0 1 110 14 Z"
              fill="#432c7a"
              data-target="da"
            />
          </svg>
        </div>
      </div>

      <!-- Colonna destra: dettaglio skill dei 3 spicchi -->
      <div class="col-lg-7 pillars-col">
        <div class="pie-pillars">
          <!-- 1. Engineering -->
          <div class="pie-pillar pie-pillar--eng" data-slice="eng">
            <div class="pie-pillar__head">
              <span class="pie-dot" style="background: #1e4d6b;"></span>
              <h4 class="pie-pillar__title">Engineering</h4>
            </div>
            <ul class="pie-pillar__list">
              <li>Master's degree in Mechanical Engineering</li>
            </ul>
          </div>

          <!-- 2. Project Management -->
          <div class="pie-pillar pie-pillar--pm" data-slice="pm">
            <div class="pie-pillar__head">
              <span class="pie-dot" style="background: #0d9488;"></span>
              <h4 class="pie-pillar__title">Project Management</h4>
            </div>
            <ul class="pie-pillar__list">
              <li>CAPM® certified - Project Management Institute</li>
            </ul>
          </div>

          <!-- 3. Data Analytics -->
          <div class="pie-pillar pie-pillar--da" data-slice="da">
            <div class="pie-pillar__head">
              <span class="pie-dot" style="background: #432c7a;"></span>
              <h4 class="pie-pillar__title">Data Analytics</h4>
            </div>
            <ul class="pie-pillar__list">
              <li>Advanced Excel</li>
              <li>SQL</li>
              <li>Python - Pandas, Numpy, Scikit-Learn, Matplotlib</li>
              <li>Tableau</li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<style>
  /* Titolo allineato a destra a prescindere dal tema */
  .skills-section .skills-header-row {
    display: flex;
    justify-content: flex-end;
  }

  .skills-section .skills-title-col {
    width: 100%;
    margin-left: auto;
    text-align: right !important;
  }

  .skills-section .section-title {
    display: block;
    width: 100%;
    text-align: right !important;
    margin-left: auto;
  }

  /* Layout a due colonne con centratura verticale della pie chart */
  @media (min-width: 992px) {
    .skills-section .pie-layout {
      display: flex !important;
      align-items: center !important;
    }
  }

  .skills-section .pie-col {
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
  }

  .skills-section .pie-wrapper {
    width: 280px;
    height: 280px;
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto;
    filter: drop-shadow(0 12px 24px rgba(15, 23, 42, 0.14));
  }

  .skills-section .skills-pie {
    width: 280px;
    height: 280px;
    max-width: 100%;
    aspect-ratio: 1 / 1;
    display: block;
    overflow: visible;
  }

  .skills-section .pie-slice {
    stroke: #ffffff;
    stroke-width: 2.5;
    stroke-linejoin: round;
    cursor: pointer;
    transform-origin: 110px 110px;
    transition: transform 0.22s ease, opacity 0.22s ease;
  }

  .skills-section .pie-slice:hover,
  .skills-section .pie-slice.is-active {
    transform: scale(1.04);
  }

  .skills-section .pie-pillars {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .skills-section .pie-pillar {
    background: #ffffff;
    border-radius: 14px;
    padding: 1.1rem 1.35rem;
    box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
    border-left: 5px solid transparent;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .skills-section .pie-pillar--eng { border-left-color: #1e4d6b; }
  .skills-section .pie-pillar--pm  { border-left-color: #0d9488; }
  .skills-section .pie-pillar--da  { border-left-color: #432c7a; }

  .skills-section .pie-pillar.is-active {
    transform: translateX(4px);
    box-shadow: 0 10px 24px rgba(15, 23, 42, 0.14);
  }

  .skills-section .pie-pillar__head {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 0.5rem;
  }

  .skills-section .pie-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .skills-section .pie-pillar__title {
    margin: 0;
    font-weight: 700;
    font-size: 1.05rem;
  }

  .skills-section .pie-pillar__list {
    margin: 0;
    padding-left: 1.2rem;
    font-size: 0.92rem;
    color: #334155;
  }

  .skills-section .pie-pillar__list li {
    margin-bottom: 0.2rem;
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const slices = document.querySelectorAll(".skills-section .pie-slice");
    const pillars = document.querySelectorAll(".skills-section .pie-pillar");

    function setHighlight(key) {
      slices.forEach((s) => s.classList.toggle("is-active", s.dataset.target === key));
      pillars.forEach((p) => p.classList.toggle("is-active", p.dataset.slice === key));
    }

    function clearHighlight() {
      slices.forEach((s) => s.classList.remove("is-active"));
      pillars.forEach((p) => p.classList.remove("is-active"));
    }

    slices.forEach((slice) => {
      slice.addEventListener("mouseenter", () => setHighlight(slice.dataset.target));
      slice.addEventListener("mouseleave", clearHighlight);
      slice.addEventListener("click", () => setHighlight(slice.dataset.target));
    });

    pillars.forEach((pillar) => {
      pillar.addEventListener("mouseenter", () => setHighlight(pillar.dataset.slice));
      pillar.addEventListener("mouseleave", clearHighlight);
    });
  });
</script>
